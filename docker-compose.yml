# Optional local Postgres for development and the integration test suite.
#
# Supabase is the intended database for this project — this compose file simply
# lets you run and test the stack without a network dependency. The schema is
# identical either way; only DATABASE_URL changes.
#
#   docker compose up -d
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/appointment_ai npm run db:migrate

services:
  postgres:
    image: postgres:16-alpine
    container_name: appointment-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appointment_ai
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
